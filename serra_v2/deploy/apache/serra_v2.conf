<VirtualHost *:80>
    ServerName serra-v2

    ServerAdmin webmaster@localhost
    DocumentRoot /var/www/serra_v2

    <Directory /var/www/serra_v2>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/serra_v2_error.log
    CustomLog ${APACHE_LOG_DIR}/serra_v2_access.log combined
</VirtualHost>
