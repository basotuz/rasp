<!doctype html>
<html lang="it">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Serra v2</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/dashboard.css') }}">
  </head>
  <body>
    <main class="shell">
      <header class="topbar">
        <div>
          <h1>Serra v2</h1>
          <p>Dashboard operativa iniziale</p>
        </div>
        <strong class="mode">{{ status.mode }}</strong>
      </header>

      <section class="grid" aria-label="Stato serra">
        <article class="metric">
          <span>Temperatura aria</span>
          <strong>-- °C</strong>
        </article>
        <article class="metric">
          <span>Umidita' aria</span>
          <strong>-- %</strong>
        </article>
        <article class="metric">
          <span>Umidita' terreno</span>
          <strong>-- %</strong>
        </article>
        <article class="metric">
          <span>Tetto</span>
          <strong>{{ "Aperto" if status.roof_open else "Chiuso" }}</strong>
        </article>
      </section>
    </main>
  </body>
</html>
